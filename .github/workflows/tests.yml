# Lint and tests on every pull request and push to main (owner rule 2026-11-20: merge only when green).
# The contract tests (tests/qa_contract) read the Home Assistant config repo, which is not checked out
# here: they are skipped in CI and run on the Pi (about 1 s).
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # same as the app image (Dockerfile: python:3.13-slim-bookworm)
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Pytest
        run: python -m pytest -q
