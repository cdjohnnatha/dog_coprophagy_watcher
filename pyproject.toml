[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ellie"
version = "3.0.0"
description = "Counts Ellie's pees per visit (Frigate + Gemini), Home Assistant app"
readme = "README.md"
requires-python = ">=3.13"
# Exact pins (all have aarch64 wheels). Versions checked 2026-10-29.
dependencies = [
  "google-genai==2.34.0",
  "aiomqtt==2.5.1",
  "httpx==0.28.1",
  "pillow==13.0.0",
  "pydantic==2.14.1",
  "tzdata",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
  "jsonschema==4.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ellie = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
